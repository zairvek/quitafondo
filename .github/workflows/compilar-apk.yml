name: Compilar APK

# Compila la app en cada cambio y publica el APK en "Releases" con un enlace fijo:
# https://github.com/<usuario>/<repo>/releases/download/ultima/Quitafondo.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del motor
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Quitafondo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar enlace de descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Quitafondo.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Quitafondo.apk \
            --target "${{ github.sha }}" \
            --title "Quitafondo (última versión)" \
            --notes "Descarga Quitafondo.apk en tu teléfono Android y ábrelo para instalarlo." \
            --latest
